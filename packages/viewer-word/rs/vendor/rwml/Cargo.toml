[package]
edition = "2021"
rust-version = "1.85"
name = "rwml"
version = "0.1.4"
authors = ["Hyunjo Jung <mrjung0987@seoultech.ac.kr>"]
build = false
exclude = [
    ".github/",
    "rwml-fonts/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Native Rust toolkit for Microsoft Word — read, write, edit, and render legacy .doc (Word 97-2003, [MS-DOC]) and modern .docx (OOXML): one document model, package-preserving edits, field evaluation, Markdown/HTML export, PDF preview"
homepage = "https://github.com/HyunjoJung/rwml"
documentation = "https://docs.rs/rwml"
readme = "README.md"
keywords = [
    "doc",
    "docx",
    "msword",
    "ole2",
    "parser",
]
categories = [
    "parser-implementations",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/HyunjoJung/rwml"

[features]
bundled-fonts = [
    "render",
    "dep:rwml-fonts",
]
default = ["docx"]
docx = [
    "dep:zip",
    "dep:quick-xml",
    "dep:flate2",
]
render = [
    "dep:krilla",
    "dep:parley",
]

[lib]
name = "rwml"
crate-type = [
    "rlib",
    "cdylib",
]
path = "src/lib.rs"

[[bin]]
