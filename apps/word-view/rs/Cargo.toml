[package]
name = "word-view-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# vendor 份:docx numbering 补中文计数格式(chineseCounting 等)
rwml = { path = "vendor/rwml" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
base64 = "0.22"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
