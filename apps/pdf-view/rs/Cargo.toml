[package]
name = "pdfium-view-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfium-render = "0.9"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["ImageData"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
